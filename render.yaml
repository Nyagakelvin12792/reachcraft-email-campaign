services:
  - type: web
    name: reachcraft-email-campaign
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: node dist/server/src/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      - key: DATABASE_URL
        value: "file:/app/data/prod.db"
      - key: SEND_DELAY_MS
        value: "2000"
      - key: MAX_RETRIES
        value: "3"
      - key: MAX_RECIPIENTS
        value: "100"
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
    disk:
      name: sqlite-data
      mountPath: /app/data
      sizeGB: 1
